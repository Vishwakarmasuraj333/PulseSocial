version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsesocial-postgres
    restart: always
    environment:
      POSTGRES_USER: pulsesocial
      POSTGRES_PASSWORD: pulsesocial_password
      POSTGRES_DB: pulsesocial_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pulsesocial-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
